version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: shedule_db
    environment:
      POSTGRES_USER: shedule
      POSTGRES_PASSWORD: shedule
      POSTGRES_DB: shedule
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    restart: unless-stopped

volumes:
  postgres_data:

